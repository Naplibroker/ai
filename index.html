<script>
"use strict";
/* ============================================================================
 *  Napli AI 前端核心 v2
 *  對接後端協定：POST /api/login（防暴力破解）→ Bearer Token →
 *  POST /api/chat SSE：meta → delta(多次) → done / error；401 自動重登入
 * ==========================================================================*/

// ---------------------------------------------------------------------------
// 0. 安全儲存層：localStorage 不可用時退回記憶體
// ---------------------------------------------------------------------------
const store = (() => {
  const mem = new Map();
  let ok = false;
  try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); ok = true; } catch { ok = false; }
  return {
    get(k, fb) {
      try { const v = ok ? localStorage.getItem(k) : mem.get(k); return v == null ? fb : JSON.parse(v); }
      catch { return fb; }
    },
    set(k, v) {
      const s = JSON.stringify(v);
      try { if (ok) localStorage.setItem(k, s); else mem.set(k, s); } catch { mem.set(k, s); }
    },
    del(k) { try { if (ok) localStorage.removeItem(k); } catch {} mem.delete(k); },
  };
})();

// ---------------------------------------------------------------------------
// 1. 全域狀態
// ---------------------------------------------------------------------------
const DEFAULT_API = "https://insurance-brain-api.puretruthson.workers.dev";
const state = {
  apiBase: store.get("napli_api", DEFAULT_API),
  conversations: store.get("napli_convs", []),
  activeId: null,
  streaming: false,
  abort: null,
  auth: store.get("napli_token", null),  // { token, expires_at }
  lockTimer: null,
};

const $ = (id) => document.getElementById(id);
const els = {
  chat: $("chat"), welcome: $("welcome"), scroll: $("scroll-area"),
  input: $("input"), send: $("btn-send"), stop: $("btn-stop"),
  convList: $("conv-list"), title: $("chat-title"),
  apiDot: $("api-dot"), apiLabel: $("api-label"),
  loginOverlay: $("login-overlay"), loginCard: $("login-card"),
  loginPw: $("login-password"), loginMsg: $("login-msg"), loginBtn: $("login-submit"),
};

// ---------------------------------------------------------------------------
// 2. 驗證層：Token 管理、登入流程、震動/封鎖倒數 UX
// ---------------------------------------------------------------------------
function apiUrl(path) { return state.apiBase.replace(/\/+$/, "") + path; }
function hasValidToken() {
  return !!(state.auth?.token && state.auth?.expires_at && Date.now() < state.auth.expires_at - 60_000);
}
function authHeaders() {
  return state.auth?.token ? { Authorization: "Bearer " + state.auth.token } : {};
}
function clearAuth() { state.auth = null; store.del("napli_token"); }

function showLogin(msg = "") {
  clearAuth();
  els.loginMsg.textContent = msg;
  els.loginOverlay.classList.remove("hidden");
  els.loginOverlay.classList.add("flex");
  setTimeout(() => els.loginPw.focus(), 50);
}
function hideLogin() {
  els.loginOverlay.classList.add("hidden");
  els.loginOverlay.classList.remove("flex");
  els.input.focus();
}
function loginShake(msg) {
  els.loginMsg.textContent = msg;
  els.loginPw.classList.add("border-red-500");
  els.loginCard.classList.remove("shake");
  void els.loginCard.offsetWidth;              // 重觸發動畫
  els.loginCard.classList.add("shake");
  setTimeout(() => els.loginPw.classList.remove("border-red-500"), 1200);
}
function lockCountdown(seconds) {
  clearInterval(state.lockTimer);
  els.loginBtn.disabled = true;
  els.loginPw.disabled = true;
  let left = seconds;
  const tick = () => {
    const m = String(Math.floor(left / 60)).padStart(2, "0");
    const s = String(left % 60).padStart(2, "0");
    els.loginMsg.textContent = `🔒 IP 已被封鎖，請於 ${m}:${s} 後重試`;
    if (--left < 0) {
      clearInterval(state.lockTimer);
      els.loginBtn.disabled = false;
      els.loginPw.disabled = false;
      els.loginMsg.textContent = "封鎖已解除，可重新嘗試。";
    }
  };
  tick();
  state.lockTimer = setInterval(tick, 1000);
}

async function doLogin() {
  const password = els.loginPw.value;
  if (!password || els.loginBtn.disabled) return;
  els.loginBtn.disabled = true;
  els.loginMsg.textContent = "驗證中…";
  try {
    const res = await fetch(apiUrl("/api/login"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password }),
    });
    const data = await res.json().catch(() => ({}));

    if (res.ok && data.token) {
      state.auth = { token: data.token, expires_at: data.expires_at };
      store.set("napli_token", state.auth);
      els.loginPw.value = "";
      els.loginMsg.textContent = "";
      hideLogin();
      return;
    }
    if (res.status === 429) {
      lockCountdown(Number(data.retry_after_seconds) || 900);
      loginShake("");
      return;
    }
    const left = data.remaining_attempts != null ? `（剩餘 ${data.remaining_attempts} 次機會）` : "";
    loginShake((data.error || "密碼錯誤") + left);
  } catch {
    loginShake("無法連線到伺服器，請檢查 ⚙ API 設定");
  } finally {
    if (!state.lockTimer || els.loginMsg.textContent.indexOf("封鎖") === -1) els.loginBtn.disabled = false;
  }
}
els.loginBtn.addEventListener("click", doLogin);
els.loginPw.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); doLogin(); }
});
$("btn-logout").addEventListener("click", () => showLogin("已登出，請重新輸入密碼。"));

// 登入卡上的 API 端點設定（解決「未登入無法點 ⚙」的死鎖）
function refreshLoginApiHost() {
  try { $("login-api-host").textContent = new URL(state.apiBase).host; }
  catch { $("login-api-host").textContent = "未設定"; }
}
$("login-api-btn").addEventListener("click", () => {
  const v = window.prompt("後端 API 端點（不含路徑）：", state.apiBase);
  if (v && v.trim()) {
    state.apiBase = v.trim().replace(/\/+$/, "");
    store.set("napli_api", state.apiBase);
    refreshLoginApiHost();
    els.loginMsg.textContent = "API 端點已更新，請重新嘗試登入。";
    checkHealth();
  }
});
refreshLoginApiHost();

// ---------------------------------------------------------------------------
// 3. Markdown 渲染
// ---------------------------------------------------------------------------
marked.setOptions({ gfm: true, breaks: true });
function renderMD(raw) { return DOMPurify.sanitize(marked.parse(raw || "")); }
function highlightIn(el) {
  el.querySelectorAll("pre code:not(.hljs)").forEach((b) => { try { hljs.highlightElement(b); } catch {} });
}

// ---------------------------------------------------------------------------
// 4. 對話持久化與側欄
// ---------------------------------------------------------------------------
function persist() { store.set("napli_convs", state.conversations); }
function activeConv() { return state.conversations.find((c) => c.id === state.activeId) || null; }

function newConversation() {
  const conv = { id: "c" + Date.now().toString(36), title: "新對話", messages: [] };
  state.conversations.unshift(conv);
  state.activeId = conv.id;
  persist(); renderSidebar(); renderChat();
}

function renderSidebar() {
  els.convList.innerHTML = "";
  for (const c of state.conversations) {
    const item = document.createElement("div");
    item.className = "group flex items-center gap-1 rounded-lg px-3 py-2 text-[13px] cursor-pointer transition-colors " +
      (c.id === state.activeId ? "bg-[#1e1e25] text-zinc-100" : "text-zinc-400 hover:bg-[#17171c] hover:text-zinc-200");
    const label = document.createElement("span");
    label.className = "flex-1 truncate";
    label.textContent = c.title;
    const del = document.createElement("button");
    del.className = "opacity-0 group-hover:opacity-100 text-zinc-600 hover:text-red-400 px-1 transition-opacity";
    del.textContent = "✕";
    del.title = "刪除對話";
    del.addEventListener("click", (e) => {
      e.stopPropagation();
      state.conversations = state.conversations.filter((x) => x.id !== c.id);
      if (state.activeId === c.id) state.activeId = state.conversations[0]?.id || null;
      if (!state.activeId) newConversation(); else { persist(); renderSidebar(); renderChat(); }
    });
    item.append(label, del);
    item.addEventListener("click", () => {
      if (state.streaming) return;
      state.activeId = c.id; renderSidebar(); renderChat();
    });
    els.convList.appendChild(item);
  }
}

// ---------------------------------------------------------------------------
// 5. 訊息 DOM
// ---------------------------------------------------------------------------
function userBubble(text) {
  const wrap = document.createElement("div");
  wrap.className = "flex justify-end fade-in";
  const b = document.createElement("div");
  b.className = "max-w-[85%] rounded-2xl rounded-br-md bg-[#22222a] border border-[#2e2e36] px-4 py-2.5 text-[15px] leading-7 whitespace-pre-wrap";
  b.textContent = text;
  wrap.appendChild(b);
  return wrap;
}

function assistantBlock() {
  const wrap = document.createElement("div");
  wrap.className = "fade-in relative group";
  wrap.innerHTML = `
    <div class="flex items-center gap-2 mb-2">
      <div class="w-6 h-6 rounded-md bg-gradient-to-br from-amber-400 to-amber-600 grid place-items-center text-black text-[10px] font-bold font-mono">N</div>
      <span class="text-[12px] text-zinc-500 font-mono">Napli AI</span>
      <span class="loading-dots flex gap-1 ml-1"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
    </div>
    <div class="stats-slot"></div>
    <div class="md report caret"></div>
    <div class="copy-slot absolute -top-1 right-0"></div>`;
  return wrap;
}

function attachCopyButton(block, getText) {
  const slot = block.querySelector(".copy-slot");
  const btn = document.createElement("button");
  btn.className = "opacity-0 group-hover:opacity-100 flex items-center gap-1.5 rounded-lg border border-[#2e2e36] bg-[#17171c] hover:bg-[#1f1f26] hover:border-amber-500/40 px-2.5 py-1.5 text-[12px] text-zinc-300 transition-all";
  btn.innerHTML = "📋 複製報告";
  btn.addEventListener("click", async () => {
    const text = getText();
    let done = false;
    try { await navigator.clipboard.writeText(text); done = true; }
    catch {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { done = document.execCommand("copy"); } catch { done = false; }
      ta.remove();
    }
    btn.innerHTML = done ? "✅ 已複製！" : "⚠ 複製失敗";
    setTimeout(() => (btn.innerHTML = "📋 複製報告"), 1600);
  });
  slot.appendChild(btn);
}

// ---------------------------------------------------------------------------
// 6. 風險儀表板卡片（消費 meta 事件）
// ---------------------------------------------------------------------------
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function fmt(n) { return (n == null ? 0 : Number(n)).toLocaleString("zh-TW"); }

function statsCardHTML(meta) {
  const s = meta?.stats, o = s?.overview || {};
  if (!s) return "";
  const chips = [];
  if (meta.intent?.industry) chips.push(`行業：${esc(meta.intent.industry)}`);
  if (meta.intent?.hazard_type) chips.push(`危害焦點：${esc(meta.intent.hazard_type)}`);
  chips.push(`範圍：${esc(s.scope?.country || "全部來源")}`);

  const hazardRows = (s.hazard_breakdown || []).slice(0, 10).map((h) => `
    <tr>
      <td class="py-1 pr-3 text-zinc-300">${esc(h.hazard_type)}</td>
      <td class="py-1 pr-3 text-right font-mono">${fmt(h.cases)}</td>
      <td class="py-1 pr-3 text-right font-mono text-zinc-400">${fmt(h.units)}</td>
      <td class="py-1 text-right font-mono text-zinc-400">${fmt(h.incidents)}</td>
    </tr>`).join("");

  const srcCount = (meta.sources || []).length;

  return `
  <div class="mb-4 rounded-xl border border-amber-500/25 bg-gradient-to-b from-[#171712] to-[#131316] p-4">
    <div class="flex flex-wrap items-center gap-2 mb-3">
      <span class="text-[12px] font-bold text-amber-400 tracking-wide">📊 全量大數據掃描</span>
      ${chips.map((c) => `<span class="text-[11px] rounded-full border border-[#33332a] bg-[#1b1b16] px-2 py-0.5 text-zinc-400">${c}</span>`).join("")}
    </div>
    ${(s.source_breakdown || []).length ? `
    <div class="flex flex-wrap gap-1.5 mb-3">
      ${(s.source_breakdown || []).map((b) => `
      <span class="text-[11px] rounded-md border border-[#2e2e36] bg-[#101014] px-2 py-1 text-zinc-400">
        <span class="text-amber-400/90 font-mono">${esc(b.data_source)}</span> ${fmt(b.cases)} 件
        <span class="text-zinc-600">（${esc(b.year_min ?? "?")}–${esc(b.year_max ?? "?")}）</span>
      </span>`).join("")}
    </div>` : ""}
    <div class="grid grid-cols-3 gap-3 mb-3">
      <div class="rounded-lg bg-[#101014] border border-[#26262b] p-3 text-center">
        <div class="font-mono text-xl font-bold text-amber-400">${fmt(o.total_cases)}</div>
        <div class="text-[11px] text-zinc-500 mt-0.5">歷史違規/召回件數</div>
      </div>
      <div class="rounded-lg bg-[#101014] border border-[#26262b] p-3 text-center">
        <div class="font-mono text-xl font-bold text-zinc-100">${fmt(o.total_units)}</div>
        <div class="text-[11px] text-zinc-500 mt-0.5">受影響產品總數</div>
      </div>
      <div class="rounded-lg bg-[#101014] border border-[#26262b] p-3 text-center">
        <div class="font-mono text-xl font-bold text-red-400">${fmt(o.total_incidents)}</div>
        <div class="text-[11px] text-zinc-500 mt-0.5">事故通報總數</div>
      </div>
    </div>
    ${hazardRows ? `
    <table class="w-full text-[12px]">
      <thead><tr class="text-zinc-500 border-b border-[#26262b]">
        <th class="text-left pb-1 font-medium">危害類型</th>
        <th class="text-right pb-1 font-medium">件數</th>
        <th class="text-right pb-1 font-medium">影響量</th>
        <th class="text-right pb-1 font-medium">事故</th>
      </tr></thead>
      <tbody>${hazardRows}</tbody>
    </table>` : ""}
    ${(s.hazard_examples || []).length ? `
    <details class="mt-3">
      <summary class="text-[12px] text-amber-400/90 cursor-pointer select-none hover:text-amber-300">📌 各危害代表案例（點開查證，召回編號可於 cpsc.gov 搜尋）</summary>
      <div class="mt-2 space-y-1.5">
        ${(s.hazard_examples || []).map((e) => `
        <div class="text-[11.5px] leading-5 rounded-lg bg-[#101014] border border-[#26262b] px-3 py-2">
          <span class="text-amber-400/90">${esc(e.hazard_type)}</span>
          <span class="text-zinc-300"> ｜ ${esc(e.title)}</span>
          <span class="text-zinc-500"> ｜ ${esc(e.country ?? "?")} ｜ ${esc(e.year ?? "?")} 年 ｜ 編號 <span class="font-mono text-zinc-400">${esc(e.recall_no || "無")}</span> ｜ 事故 ${fmt(e.incident_count)}</span>
        </div>`).join("")}
      </div>
    </details>` : ""}
    <div class="mt-2 text-[11px] text-zinc-600">統計為 SQL 全表聚合（非抽樣）｜引用來源 ${srcCount} 份（含條款與案例）</div>
  </div>`;
}

// ---------------------------------------------------------------------------
// 7. 智慧自動捲動
// ---------------------------------------------------------------------------
let stickBottom = true;
els.scroll.addEventListener("scroll", () => {
  const d = els.scroll.scrollHeight - els.scroll.scrollTop - els.scroll.clientHeight;
  stickBottom = d < 140;
});
function autoScroll() {
  if (stickBottom) els.scroll.scrollTo({ top: els.scroll.scrollHeight, behavior: "auto" });
}

// ---------------------------------------------------------------------------
// 8. SSE 串流核心（帶 Bearer Token；401 拋出 AuthError）
// ---------------------------------------------------------------------------
class AuthError extends Error { constructor(m) { super(m); this.name = "AuthError"; } }

async function streamChat({ message, history, onMeta, onDelta, onError, signal }) {
  const res = await fetch(apiUrl("/api/chat"), {
    method: "POST",
    headers: { "Content-Type": "application/json", ...authHeaders() },
    body: JSON.stringify({ message, history }),
    signal,
  });
  if (res.status === 401) throw new AuthError("Token 失效或未授權");
  if (!res.ok || !res.body) {
    let detail = "";
    try { detail = (await res.json()).error || ""; } catch {}
    throw new Error(`後端回應 ${res.status} ${detail}`);
  }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });

    let sep;
    while ((sep = buffer.indexOf("\n\n")) !== -1) {
      const block = buffer.slice(0, sep);
      buffer = buffer.slice(sep + 2);

      let event = "message", data = "";
      for (const line of block.split("\n")) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        else if (line.startsWith("data:")) data += line.slice(5).trim();
      }
      if (!data) continue;
      let payload = {};
      try { payload = JSON.parse(data); } catch { continue; }

      if (event === "meta") onMeta(payload);
      else if (event === "delta") onDelta(payload.text || "");
      else if (event === "error") onError(payload.message || "未知錯誤");
      else if (event === "done") return;
    }
  }
}

// ---------------------------------------------------------------------------
// 9. 發送流程總控
// ---------------------------------------------------------------------------
function setStreamingUI(on) {
  state.streaming = on;
  els.send.classList.toggle("hidden", on);
  els.stop.classList.toggle("hidden", !on);
  els.input.disabled = on;
}

async function sendMessage(text) {
  text = (text ?? els.input.value).trim();
  if (!text || state.streaming) return;
  if (!hasValidToken()) { showLogin("登入已過期，請重新輸入密碼。"); return; }
  if (!state.activeId) newConversation();
  const conv = activeConv();

  els.welcome.classList.add("hidden");
  els.chat.appendChild(userBubble(text));
  const block = assistantBlock();
  els.chat.appendChild(block);
  stickBottom = true; autoScroll();

  conv.messages.push({ role: "user", content: text });
  if (conv.title === "新對話") { conv.title = text.slice(0, 24); els.title.textContent = conv.title; renderSidebar(); }
  persist();

  els.input.value = ""; els.input.style.height = "auto"; updateSendState();
  setStreamingUI(true);

  const reportEl = block.querySelector(".report");
  const statsSlot = block.querySelector(".stats-slot");
  const loading = block.querySelector(".loading-dots");
  let raw = "", statsHTML = "", renderQueued = false, firstToken = true;

  const scheduleRender = () => {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => {
      renderQueued = false;
      reportEl.innerHTML = renderMD(raw);
      highlightIn(reportEl);
      autoScroll();
    });
  };

  state.abort = new AbortController();
  const history = conv.messages.slice(0, -1).slice(-6)
    .map((m) => ({ role: m.role, content: m.content }));

  try {
    await streamChat({
      message: text, history, signal: state.abort.signal,
      onMeta: (meta) => {
        statsHTML = statsCardHTML(meta);
        statsSlot.innerHTML = statsHTML;
        autoScroll();
      },
      onDelta: (t) => {
        if (firstToken) { firstToken = false; loading?.remove(); }
        raw += t;
        scheduleRender();
      },
      onError: (msg) => { throw new Error(msg); },
    });
  } catch (err) {
    loading?.remove();
    if (err?.name === "AbortError") {
      raw += "\n\n> ⏹ 已由使用者中止生成。";
    } else if (err instanceof AuthError) {
      raw += "\n\n> 🔐 **登入已失效**，請重新登入後再送出一次。";
      showLogin("Token 已失效，請重新輸入密碼。");
    } else {
      raw += `\n\n> ⚠️ **連線或後端錯誤**：${err.message}\n> 請檢查右上角 ⚙ 的 API 端點設定，或稍後再試。`;
    }
    reportEl.innerHTML = renderMD(raw);
  } finally {
    reportEl.classList.remove("caret");
    loading?.remove();
    setStreamingUI(false);
    state.abort = null;
    conv.messages.push({ role: "assistant", content: raw, statsHTML });
    persist();
    attachCopyButton(block, () => raw);
    scheduleRender();
    els.input.focus();
  }
}

// ---------------------------------------------------------------------------
// 10. 重新渲染整個對話
// ---------------------------------------------------------------------------
function renderChat() {
  const conv = activeConv();
  els.chat.innerHTML = "";
  els.title.textContent = conv?.title || "新對話";
  const empty = !conv || conv.messages.length === 0;
  els.welcome.classList.toggle("hidden", !empty);
  if (empty) return;

  for (const m of conv.messages) {
    if (m.role === "user") {
      els.chat.appendChild(userBubble(m.content));
    } else {
      const block = assistantBlock();
      block.querySelector(".loading-dots")?.remove();
      const reportEl = block.querySelector(".report");
      reportEl.classList.remove("caret");
      reportEl.innerHTML = renderMD(m.content);
      if (m.statsHTML) block.querySelector(".stats-slot").innerHTML = m.statsHTML;
      highlightIn(reportEl);
      attachCopyButton(block, () => m.content);
      els.chat.appendChild(block);
    }
  }
  els.scroll.scrollTop = els.scroll.scrollHeight;
}

// ---------------------------------------------------------------------------
// 11. 輸入框行為
// ---------------------------------------------------------------------------
function updateSendState() { els.send.disabled = !els.input.value.trim() || state.streaming; }
els.input.addEventListener("input", () => {
  els.input.style.height = "auto";
  els.input.style.height = Math.min(els.input.scrollHeight, 200) + "px";
  updateSendState();
});
els.input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    sendMessage();
  }
});
els.send.addEventListener("click", () => sendMessage());
els.stop.addEventListener("click", () => state.abort?.abort());

// ---------------------------------------------------------------------------
// 12. 側欄收折
// ---------------------------------------------------------------------------
const isMobile = () => window.matchMedia("(max-width: 768px)").matches;
$("btn-sidebar").addEventListener("click", () => {
  if (isMobile()) {
    document.body.classList.toggle("sidebar-open-mobile");
    $("backdrop").classList.toggle("hidden", !document.body.classList.contains("sidebar-open-mobile"));
  } else {
    document.getElementById("app").classList.toggle("sidebar-hidden");
  }
});
$("backdrop").addEventListener("click", () => {
  document.body.classList.remove("sidebar-open-mobile");
  $("backdrop").classList.add("hidden");
});
$("btn-new").addEventListener("click", () => { if (!state.streaming) newConversation(); });

// ---------------------------------------------------------------------------
// 13. 設定彈窗 + 健康檢查（/api/health 為公開端點）
// ---------------------------------------------------------------------------
const modal = $("settings-modal");
$("btn-settings").addEventListener("click", () => {
  $("api-input").value = state.apiBase;
  modal.classList.remove("hidden"); modal.classList.add("flex");
});
$("settings-cancel").addEventListener("click", () => { modal.classList.add("hidden"); modal.classList.remove("flex"); });
$("settings-save").addEventListener("click", async () => {
  const v = $("api-input").value.trim().replace(/\/+$/, "");
  if (v) { state.apiBase = v; store.set("napli_api", v); }
  modal.classList.add("hidden"); modal.classList.remove("flex");
  checkHealth();
});

async function checkHealth() {
  els.apiDot.className = "w-2 h-2 rounded-full bg-zinc-600";
  try { els.apiLabel.textContent = new URL(state.apiBase).host; } catch { els.apiLabel.textContent = "無效網址"; }
  try {
    const r = await fetch(apiUrl("/api/health"), { signal: AbortSignal.timeout(6000) });
    const ok = r.ok && (await r.json()).ok;
    els.apiDot.className = "w-2 h-2 rounded-full " + (ok ? "bg-emerald-400" : "bg-red-400");
  } catch {
    els.apiDot.className = "w-2 h-2 rounded-full bg-red-400";
  }
}

// ---------------------------------------------------------------------------
// 14. 建議提示卡 + 啟動（登入守門）
// ---------------------------------------------------------------------------
document.querySelectorAll(".suggest").forEach((b) =>
  b.addEventListener("click", () => sendMessage(b.querySelector("div:last-child").textContent))
);

(function init() {
  if (state.conversations.length === 0) newConversation();
  else { state.activeId = state.conversations[0].id; renderSidebar(); renderChat(); }
  checkHealth();
  if (!hasValidToken()) showLogin();
  else els.input.focus();
})();
</script>
